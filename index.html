<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA Daily Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the day picker is a switch chassis, each day a port whose link LED shows your best score. */
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#15212c; --muted:#5a6977; --line:#d2d9e0; --accent:#0b67b2;
  --accent-ink:#ffffff; --soft:#e3ebf3;
  --ok:#1b9e52; --warn:#d38b0b; --bad:#cc3d3d; --ok-soft:#e1f4e8; --bad-soft:#fbe6e6;
  --chassis:#27313b; --chassis-2:#1d252d; --port:#11171d; --port-ink:#dfe7ee; --port-muted:#8b9aa8;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --panel:#161f28; --ink:#e4ebf1; --muted:#90a0ae; --line:#2a3743; --accent:#4ea2f0;
    --accent-ink:#06121e; --soft:#1c2a37; --ok:#3cc477; --warn:#f0a92a; --bad:#ef6464; --ok-soft:#173326; --bad-soft:#3a1d1f;
    --chassis:#1f2932; --chassis-2:#182029; --port:#0a0f14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --panel:#161f28; --ink:#e4ebf1; --muted:#90a0ae; --line:#2a3743; --accent:#4ea2f0;
  --accent-ink:#06121e; --soft:#1c2a37; --ok:#3cc477; --warn:#f0a92a; --bad:#ef6464; --ok-soft:#173326; --bad-soft:#3a1d1f;
  --chassis:#1f2932; --chassis-2:#182029; --port:#0a0f14; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,.port:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.2rem,5vw,3.4rem);text-transform:uppercase}
h2{font-size:1.9rem;text-transform:uppercase}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.top p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:96px}
.stat b{display:block;font:600 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* chassis */
.chassis{background:linear-gradient(180deg,var(--chassis),var(--chassis-2));border-radius:10px;padding:14px 16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(10,20,30,.18);position:relative}
.chassis::before,.chassis::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7b8792,#3a444d)}
.chassis::before{left:10px}.chassis::after{right:10px}
.chassis-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 18px 12px;color:var(--port-muted);font:500 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}
.legend{display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.port{background:var(--port);border:1px solid #2f3b46;border-radius:6px;padding:10px 10px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--port-ink);transition:transform .12s ease,border-color .12s ease;min-height:112px}
.port:hover{border-color:#5d7286;transform:translateY(-1px)}
.port-top{display:flex;align-items:center;justify-content:space-between}
.jack{width:30px;height:22px;background:#05080b;border:1px solid #3a4652;clip-path:polygon(0 0,100% 0,100% 72%,72% 72%,72% 100%,28% 100%,28% 72%,0 72%);position:relative}
.jack::after{content:"";position:absolute;left:5px;right:5px;top:3px;height:3px;background:repeating-linear-gradient(90deg,#b8952e 0 2px,transparent 2px 4px)}
.led{width:9px;height:9px;border-radius:50%;background:#2b343c;box-shadow:inset 0 0 0 1px #000}
.led.on{background:#2fd06d;box-shadow:0 0 8px #2fd06d}
.led.mid{background:#f2a51f;box-shadow:0 0 8px #f2a51f}
.port-day{font:600 1.15rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.port-topic{font-size:.84rem;line-height:1.3;color:var(--port-ink);opacity:.9}
.port-meta{margin-top:auto;font:400 .7rem var(--mono);color:var(--port-muted);display:flex;justify-content:space-between;gap:6px}

/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-left:0}
.btn.ghost:hover{color:var(--ink)}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.mixed{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.mixed h3{font-size:1.35rem;text-transform:uppercase}
.mixed label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
.kv{display:flex;gap:22px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}
.kv b{font:600 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.kv span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode h3{font-size:1.3rem;text-transform:uppercase;margin-bottom:4px}
.mode p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.labs{font-size:.9rem;color:var(--muted)}
.labs ul{margin:6px 0 0;padding-left:18px}
.labs li{color:var(--ink)}

/* quiz */
.quiz{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.qtext{font-size:1.2rem;line-height:1.55;white-space:pre-line;margin:0}
.qtext img{display:block;max-width:100%;margin:10px 0;border-radius:6px;background:#fff;padding:6px}
.cli{display:inline-block;font-family:var(--mono);font-size:.95em;background:var(--soft);padding:1px 6px;border-radius:4px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 2px;height:1em;vertical-align:-2px}
.src{font:500 .72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px;white-space:pre-line;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font:500 .78rem var(--mono);color:var(--muted)}
.opt.cmd .t{font-family:var(--mono);font-size:.92rem}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{border-left:4px solid var(--ok);background:var(--panel);border-radius:0 8px 8px 0;padding:12px 16px;white-space:pre-line}
.feedback.no{border-color:var(--bad)}
.feedback b{display:block;margin-bottom:2px}
.hint{font-size:.8rem;color:var(--muted)}
kbd{font:500 .75rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}

/* flashcards */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer;text-align:left}
.flash .answer{border-top:1px dashed var(--line);padding-top:14px;white-space:pre-line;font-size:1.15rem;font-weight:500}
.flash .answer.cmd{font-family:var(--mono);font-size:1rem}

/* results */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score .big{font:700 4.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.missed li{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.missed .q{white-space:pre-line}
.missed .a{white-space:pre-line;color:var(--ok);font-weight:500;margin-top:6px}
.missed .a.cmd{font-family:var(--mono);font-size:.92rem}
.missed .src{margin-bottom:4px}
footer{color:var(--muted);font-size:.82rem}
@media (max-width:420px){.wrap{padding:20px 16px 48px}.ports{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('bank').textContent);
const DECKS = DATA.decks, LABS = DATA.labs, IMAGES = DATA.images;
const byId = Object.fromEntries(DECKS.map(d=>[d.id,d]));
const app = document.getElementById('app');
const KEY = 'ccna-daily-quiz-v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.\s]+$/,'').trim();
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const dayLabel = d => 'Day ' + d.day + (d.part ? '·' + d.part : '');
const CLI_LINE = /^[A-Za-z0-9_-]+(\([\w-]+\))?#/;
function fmtQ(text){
  return text.split('\n').map(line=>{
    let h = esc(line).replace(/\[\.\.\.\]/g,'<span class="blank" aria-label="blank"></span>');
    h = h.replace(/\{\{img:([^}]+)\}\}/g,(m,n)=> IMAGES[n] ? '<img alt="Network symbol" src="'+IMAGES[n]+'">' : '');
    return CLI_LINE.test(line) ? '<span class="cli">'+h+'</span>' : h;
  }).join('\n');
}
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>3) return 9; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const CMD_WORDS = /^(no |show |ip |ipv6 |spanning-tree|switchport|interface|router |access-list|errdisable|clock|ntp |snmp|logging|channel-group|standby|vtp |line |username|crypto|transport|service |enable |hostname|copy |write|debug|network |passive|default-information|maximum-paths|auto-summary|vlan |encapsulation|description|speed|duplex|banner|exec-timeout|login|password|wlan|port-channel|lacp|pagp|cdp |lldp |permit |deny |remark|dns|aaa|radius|tacacs|ip$)/i;
function category(q,a){
  const first = a.split('\n')[0];
  if (/#\s*\[\.\.\.\]/.test(q) || CMD_WORDS.test(first)) return 'cmd';
  if (/^([0-9a-f]{4}\.){2}[0-9a-f]{4}$/i.test(first) || /^\d{1,3}(\.\d{1,3}){3}(\/\d+)?$/.test(first) || /^[0-9a-f]{0,4}(:[0-9a-f]{0,4}){2,7}(\/\d+)?$/i.test(first) || /^(ff|fe80|2001|fc|fd)[0-9a-f:]*::/i.test(first)) return 'addr';
  if (/stand for\??/i.test(q)) return 'expand';
  if (/^[\d.,\s\/x:-]+(\s*(bits?|bytes?|seconds?|secs?|ms|minutes?|hours?|days?|Mbps|Gbps|Kbps|GHz|MHz|%|dBm|mW|m|meters))?$/i.test(first)) return 'num';
  return 'term';
}
function unit(a){ const m=a.match(/[a-z%]+$/i); return m?m[0].toLowerCase():''; }

/* Build answer choices for a card */
function choicesFor(card, deck, poolDecks){
  const [q,a] = card; const na = norm(a); const firstA = norm(a.split('\n')[0]);
  // 1) bracketed choice in the question, e.g. [can/can't] or [TCP/UDP]
  const br = q.match(/\[([^\]]*[A-Za-z][^\]]*)\]/g);
  if (br && br.length===1 && !/\.\.\./.test(br[0]) && br[0].includes('/')){
    const opts = br[0].slice(1,-1).split('/').map(s=>s.trim()).filter(Boolean);
    if (opts.length>=2 && opts.length<=4){
      let idx = opts.findIndex(o=>norm(o)===firstA || norm(o)===na);
      if (idx<0) idx = opts.findIndex(o=>lev(norm(o),firstA)<=2);
      if (idx>=0) return {opts, correct: idx, exact: norm(opts[idx])===na};
      return {opts: shuffle([...opts, a.split('\n')[0]]), correctText: a.split('\n')[0]};
    }
  }
  // 2) yes / no
  const yn = firstA.match(/^(yes|no)\b/);
  if (yn) return {opts:['Yes','No'], correct: yn[1]==='yes'?0:1, exact: firstA===yn[1]};
  // 3) "..., A or B?" ending the question
  const clause = q.split(/[,:\n]/).pop().replace(/[?.]\s*$/,'').trim();
  const parts = clause.split(/\s+or\s+/i).map(s=>s.trim());
  if (parts.length>=2 && parts.length<=3 && parts.every(p=>p.split(' ').length<=3)){
    const idx = parts.findIndex(p=>norm(p)===firstA);
    if (idx>=0) return {opts:parts, correct:idx, exact: norm(parts[idx])===na};
  }
  // 4) distractors from the same deck, then neighbouring decks
  const cat = category(q,a), u = unit(a.split('\n')[0]);
  const seen = new Set([na]);
  const scored = [];
  const consider = (cand, bonus) => {
    const nc = norm(cand); if (seen.has(nc) || /^(yes|no)\b/.test(nc) || !nc) return; seen.add(nc);
    const c2 = category('', cand) === 'cmd' || (cat==='cmd' && CMD_WORDS.test(cand)) ? 'cmd' : category('', cand);
    let s = bonus;
    if (c2===cat || (cat==='expand' && c2==='term')) s += 3;
    if (cat==='num' && unit(cand.split('\n')[0])===u) s += 1.5;
    const la=a.length, lc=cand.length; s -= Math.abs(Math.log((lc+4)/(la+4)));
    if ((a.includes('\n')) === (cand.includes('\n'))) s += .5;
    if (/\d/.test(a.split('\n')[0]) === /\d/.test(cand.split('\n')[0])) s += .7;
    scored.push([s + Math.random()*0.8, cand, c2===cat]);
  };
  const good = () => scored.filter(x=>x[2]).length >= 3;
  deck.cards.forEach(c=>{ if(c!==card) consider(c[1], 1); });
  if (!good()) poolDecks.forEach(d=>{ if(d!==deck) d.cards.forEach(c=>consider(c[1], 0)); });
  if (!good() && cat!=='term') DECKS.forEach(d=>{ if(d!==deck && !poolDecks.includes(d)) d.cards.forEach(c=>consider(c[1], -0.5)); });
  scored.sort((x,y)=>y[0]-x[0]);
  const picks = scored.slice(0, 3).map(x=>x[1]);
  const opts = shuffle([a, ...picks]);
  return {opts, correct: opts.indexOf(a), exact:true};
}
function neighbours(deck){
  const i = DECKS.indexOf(deck);
  return DECKS.slice(Math.max(0,i-3), i+4);
}

/* ---------- state per deck ---------- */
function rec(id){ return store[id] || (store[id] = {best:null, last:null, attempts:0, missed:[], seen:0}); }
function ledClass(id){ const r=store[id]; if(!r||r.best==null) return ''; return r.best>=80 ? 'on' : 'mid'; }

/* ---------- views ---------- */
function home(){
  document.title = 'CCNA Daily Quiz';
  const total = DECKS.reduce((s,d)=>s+d.cards.length,0);
  const tried = DECKS.filter(d=>store[d.id] && store[d.id].best!=null).length;
  const passed = DECKS.filter(d=>store[d.id] && store[d.id].best>=80).length;
  const days = [...new Set(DECKS.map(d=>d.day))];
  const dayOpts = sel => days.map(n=>`<option value="${n}"${n===sel?' selected':''}>Day ${n}</option>`).join('');
  app.innerHTML = `
  <header class="top">
    <div>
      <h1>CCNA Daily Quiz</h1>
      <p>Every Anki deck from the CCNA 200-301 course, one port per day. Pick a day to quiz yourself or flip through its cards. The link light shows your best score: green at 80% or more, amber below that.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${DECKS.length}</b><span>Decks</span></div>
      <div class="stat"><b>${total.toLocaleString()}</b><span>Cards</span></div>
      <div class="stat"><b>${tried}</b><span>Attempted</span></div>
      <div class="stat"><b>${passed}</b><span>Passed</span></div>
    </div>
  </header>
  <section class="chassis" aria-label="Days">
    <div class="chassis-head"><span>CCNA-200-301 · ${DECKS.length} ports</span>
      <span class="legend"><span><i style="background:#2fd06d"></i>80%+</span><span><i style="background:#f2a51f"></i>Below 80%</span><span><i style="background:#2b343c;box-shadow:inset 0 0 0 1px #4a5560"></i>Not tried</span></span></div>
    <div class="ports">${DECKS.map(d=>{const r=store[d.id]; return `
      <button class="port" data-go="${d.id}" aria-label="${esc(dayLabel(d)+': '+d.topic)}">
        <span class="port-top"><span class="jack"></span><span class="led ${ledClass(d.id)}"></span></span>
        <span class="port-day">${esc(dayLabel(d))}</span>
        <span class="port-topic">${esc(d.topic)}</span>
        <span class="port-meta"><span>${d.cards.length} cards</span><span>${r&&r.best!=null? 'best '+r.best+'%':''}</span></span>
      </button>`}).join('')}</div>
  </section>
  <section class="card mixed">
    <div><h3>Mixed review</h3><span class="muted">Random questions drawn from a range of days.</span></div>
    <div class="row">
      <label for="mx-from">From <select id="mx-from">${dayOpts(days[0])}</select></label>
      <label for="mx-to">to <select id="mx-to">${dayOpts(days[days.length-1])}</select></label>
      <label for="mx-n">Questions <select id="mx-n"><option>10</option><option selected>20</option><option>40</option></select></label>
      <button class="btn primary" id="mx-go">Start mixed quiz</button>
    </div>
  </section>
  <footer>Progress is saved in this browser only. Questions come straight from your flashcards; wrong answers are other answers from the same or nearby days.</footer>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ location.hash = b.dataset.go; });
  document.getElementById('mx-go').onclick = ()=>{
    let a=+document.getElementById('mx-from').value, b=+document.getElementById('mx-to').value; if(a>b)[a,b]=[b,a];
    const n=+document.getElementById('mx-n').value;
    const ds = DECKS.filter(d=>d.day>=a&&d.day<=b);
    const items = shuffle(ds.flatMap(d=>d.cards.map((c,i)=>({deck:d,idx:i})))).slice(0,n);
    startQuiz(items, {title:`Mixed review · Day ${a}–${b}`, mixed:true});
  };
}

function deckView(d){
  document.title = dayLabel(d)+' – '+d.topic;
  const r = store[d.id] || {};
  const labs = LABS[String(d.day)] || [];
  const missed = (r.missed||[]).filter(i=>i<d.cards.length);
  app.innerHTML = `
  <button class="btn ghost" id="back">← All days</button>
  <section class="card">
    <div class="deck-head">
      <div><div class="src">${esc(dayLabel(d))}</div><h2>${esc(d.topic)}</h2></div>
      <div class="kv">
        <div><b>${d.cards.length}</b><span>Cards</span></div>
        <div><b>${r.best!=null? r.best+'%':'–'}</b><span>Best</span></div>
        <div><b>${r.last!=null? r.last+'%':'–'}</b><span>Last</span></div>
        <div><b>${r.attempts||0}</b><span>Quizzes</span></div>
      </div>
    </div>
  </section>
  <div class="modes">
    <section class="card mode">
      <h3>Quiz</h3>
      <p>Multiple choice. Keys <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>Enter</kbd> for next.</p>
      <div class="row">
        ${d.cards.length>10?'<button class="btn primary" data-n="10">10 questions</button>':''}
        ${d.cards.length>20?'<button class="btn" data-n="20">20 questions</button>':''}
        <button class="btn${d.cards.length<=10?' primary':''}" data-n="all">All ${d.cards.length}</button>
      </div>
      ${missed.length?`<div class="row" style="margin-top:10px"><button class="btn" id="retry">Retry ${missed.length} missed last time</button></div>`:''}
    </section>
    <section class="card mode">
      <h3>Flashcards</h3>
      <p>Flip each card, then mark it. Cards you mark “Again” come back at the end.</p>
      <div class="row"><button class="btn" id="flash">Study ${d.cards.length} cards</button></div>
    </section>
  </div>
  ${labs.length?`<section class="labs">Packet Tracer labs for Day ${d.day} (open these in Packet Tracer):<ul>${labs.map(l=>'<li>'+esc(l)+'</li>').join('')}</ul></section>`:''}`;
  document.getElementById('back').onclick = ()=>{ location.hash=''; };
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const all = shuffle(d.cards.map((c,i)=>({deck:d,idx:i})));
    startQuiz(b.dataset.n==='all'? all : all.slice(0,+b.dataset.n), {title:dayLabel(d)+' · '+d.topic, deck:d});
  });
  const rt = document.getElementById('retry');
  if (rt) rt.onclick = ()=> startQuiz(shuffle(missed.map(i=>({deck:d,idx:i}))), {title:dayLabel(d)+' · missed cards', deck:d, retry:true});
  document.getElementById('flash').onclick = ()=> startFlash(d);
}

/* ---------- quiz ---------- */
let keyHandler = null;
function setKeys(fn){ if(keyHandler) document.removeEventListener('keydown', keyHandler); keyHandler = fn; if(fn) document.addEventListener('keydown', fn); }

function startQuiz(items, meta){
  const st = {items, i:0, score:0, missed:[], answered:false};
  window.scrollTo(0,0);
  const render = ()=>{
    const it = st.items[st.i], card = it.deck.cards[it.idx];
    const ch = choicesFor(card, it.deck, meta.mixed ? DECKS.filter(x=>x.day===it.deck.day) .concat(neighbours(it.deck)) : neighbours(it.deck));
    if (ch.correct==null) ch.correct = ch.opts.indexOf(ch.correctText);
    st.ch = ch; st.answered=false;
    const cat = category(card[0], card[1]);
    app.innerHTML = `
    <div class="quiz">
      <div class="qbar"><button class="btn ghost" id="quit">← Quit</button><span>${esc(meta.title)}</span><span>${st.i+1} / ${st.items.length} · ${st.score} right</span></div>
      <div class="progress"><i style="width:${(st.i)/st.items.length*100}%"></i></div>
      <section class="card">
        ${meta.mixed?`<div class="src">${esc(dayLabel(it.deck)+' · '+it.deck.topic)}</div>`:''}
        <p class="qtext">${fmtQ(card[0])}</p>
      </section>
      <div class="opts">${ch.opts.map((o,k)=>`<button class="opt${cat==='cmd'&&ch.opts.length>2?' cmd':''}" data-k="${k}"><span class="k">${k+1}</span><span class="t">${esc(o)}</span></button>`).join('')}</div>
      <div id="fb"></div>
      <div class="hint">Keys <kbd>1</kbd>–<kbd>${ch.opts.length}</kbd> to answer, <kbd>Enter</kbd> for next.</div>
    </div>`;
    document.getElementById('quit').onclick = ()=> finish(true);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  };
  const answer = k=>{
    if (st.answered) return; st.answered = true;
    const it = st.items[st.i], card = it.deck.cards[it.idx], ok = k===st.ch.correct;
    if (ok) st.score++; else st.missed.push(it);
    app.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===st.ch.correct) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); });
    const showFull = !st.ch.exact || norm(st.ch.opts[st.ch.correct])!==norm(card[1]);
    document.getElementById('fb').innerHTML = `<div class="feedback${ok?'':' no'}"><b>${ok?'Correct':'Not quite'}</b>${showFull?'Card answer: '+esc(card[1]):''}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="next">${st.i+1<st.items.length?'Next question':'See results'}</button></div>`;
    document.getElementById('next').onclick = next; document.getElementById('next').focus();
  };
  const next = ()=>{ st.i++; if (st.i>=st.items.length) finish(false); else { render(); window.scrollTo(0,0);} };
  const finish = (quit)=>{
    setKeys(null);
    const done = quit ? st.i + (st.answered?1:0) : st.items.length;
    if (done===0){ meta.deck ? deckView(meta.deck) : home(); return; }
    const pct = Math.round(st.score/done*100);
    if (meta.deck && !quit){
      const r = rec(meta.deck.id); r.last=pct; r.attempts=(r.attempts||0)+1;
      if (!meta.retry && st.items.length>=Math.min(10,meta.deck.cards.length)) r.best = Math.max(r.best||0, pct);
      r.missed = st.missed.map(x=>x.idx); save();
    }
    app.innerHTML = `
    <div class="quiz">
      <div class="qbar"><span>${esc(meta.title)}</span><span>${quit?'Stopped early':'Finished'}</span></div>
      <section class="card score">
        <div class="big" style="color:${pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)'}">${pct}%</div>
        <div><b>${st.score} of ${done} correct</b><div class="muted">${pct>=80?'Link up. This one is solid.':pct>=50?'Partly converged. Run it again in a day or two.':'Still in listening state. Try flashcards first, then quiz again.'}</div></div>
      </section>
      <div class="row">
        ${st.missed.length?'<button class="btn primary" id="again-missed">Retry the '+st.missed.length+' missed</button>':''}
        <button class="btn" id="again">New quiz</button>
        <button class="btn ghost" id="home">← All days</button>
      </div>
      ${st.missed.length?`<h3 style="font-size:1.3rem;text-transform:uppercase">Review what you missed</h3>
      <ul class="missed">${st.missed.map(it=>{const c=it.deck.cards[it.idx]; return `<li>${meta.mixed?`<div class="src">${esc(dayLabel(it.deck))}</div>`:''}<div class="q">${fmtQ(c[0])}</div><div class="a${category(c[0],c[1])==='cmd'?' cmd':''}">${esc(c[1])}</div></li>`}).join('')}</ul>`:''}
    </div>`;
    window.scrollTo(0,0);
    const am=document.getElementById('again-missed'); if(am) am.onclick=()=>startQuiz(shuffle(st.missed),{...meta,title:meta.title.replace(/ · missed cards$/,'')+' · missed cards',retry:true});
    document.getElementById('again').onclick=()=>{ if(meta.deck) deckView(meta.deck); else home(); };
    document.getElementById('home').onclick=()=>{ location.hash=''; home(); };
  };
  setKeys(e=>{
    if (e.target.tagName==='SELECT') return;
    if (!st.answered && /^[1-4]$/.test(e.key) && st.ch && +e.key<=st.ch.opts.length){ e.preventDefault(); answer(+e.key-1); }
    else if (st.answered && e.key==='Enter' && document.activeElement?.id!=='next'){ e.preventDefault(); next(); }
  });
  render();
}

/* ---------- flashcards ---------- */
function startFlash(d){
  const st = {queue: shuffle(d.cards.map((c,i)=>i)), shown:false, known:0, total:d.cards.length};
  window.scrollTo(0,0);
  const render = ()=>{
    if (!st.queue.length){
      setKeys(null);
      const r=rec(d.id); r.seen=(r.seen||0)+1; save();
      app.innerHTML = `<div class="quiz"><section class="card score"><div class="big" style="color:var(--ok)">${st.total}</div><div><b>All cards reviewed</b><div class="muted">Ready to test yourself on ${esc(d.topic)}?</div></div></section>
        <div class="row"><button class="btn primary" id="toquiz">Take the quiz</button><button class="btn ghost" id="home">← All days</button></div></div>`;
      document.getElementById('toquiz').onclick=()=>deckView(d);
      document.getElementById('home').onclick=()=>{ location.hash=''; home(); };
      return;
    }
    const c = d.cards[st.queue[0]], cat = category(c[0],c[1]);
    app.innerHTML = `
    <div class="quiz">
      <div class="qbar"><button class="btn ghost" id="quit">← Back</button><span>${esc(dayLabel(d)+' · '+d.topic)}</span><span>${st.known} / ${st.total} known</span></div>
      <div class="progress"><i style="width:${st.known/st.total*100}%"></i></div>
      <section class="card flash" id="fc" tabindex="0" aria-live="polite">
        <p class="qtext">${fmtQ(c[0])}</p>
        ${st.shown?`<div class="answer${cat==='cmd'?' cmd':''}">${esc(c[1])}</div>`:'<div class="hint">Click the card or press <kbd>Space</kbd> to show the answer.</div>'}
      </section>
      ${st.shown?`<div class="row"><button class="btn" id="againb">Again <kbd>1</kbd></button><button class="btn primary" id="gotb">Got it <kbd>2</kbd></button></div>`:''}
    </div>`;
    document.getElementById('quit').onclick=()=>{ setKeys(null); deckView(d); };
    document.getElementById('fc').onclick=()=>{ if(!st.shown){ st.shown=true; render(); } };
    if (st.shown){ document.getElementById('againb').onclick=()=>mark(false); document.getElementById('gotb').onclick=()=>mark(true); }
  };
  const mark = ok=>{ const x=st.queue.shift(); if(ok) st.known++; else st.queue.push(x); st.shown=false; render(); };
  setKeys(e=>{
    if (e.key===' ' && !st.shown){ e.preventDefault(); st.shown=true; render(); }
    else if (st.shown && e.key==='1') mark(false);
    else if (st.shown && (e.key==='2' || e.key==='Enter')) mark(true);
  });
  render();
}

/* ---------- routing ---------- */
function route(){
  setKeys(null);
  const id = location.hash.slice(1);
  if (byId[id]) deckView(byId[id]); else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
})();
</script>
